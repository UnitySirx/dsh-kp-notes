# dsh-kp-notes bundle patch —— 与官方分发的其它 bundle 一致: 只 insert 一行插件,
# name 写**包名**(而不是 file:// 源码绝对路径), 这样 `dsh plugin add dsh-kp-notes` 装到别人的
# profile 里也能解析到宿主半。不写 config: root / exclude 全部交给 schema 默认值 ——
#   root    默认 ''(= DSH 当前工作目录)
#   exclude 默认 plugin / node_modules / .git / .dsh / dist / build / .obsidian
- insert:
    - id: rk-study
      name: 'dsh-kp-notes'
